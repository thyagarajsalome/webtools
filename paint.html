<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Free online house paint calculator for Asian Paint, Berger Paint, Nerolac Paint, and Dulux. Calculate paint quantity, cost, and visualize colors for your home."
    />
    <meta
      name="keywords"
      content="paint calculator, house paint, paint cost calculator, Asian Paint, Berger Paint, Nerolac Paint, Dulux, interior paint, exterior paint"
    />
    <meta name="author" content="Tool website" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph Meta Tags -->
    <meta
      property="og:title"
      content="House Paint Calculator - Calculate Paint Quantity and Cost"
    />
    <meta
      property="og:description"
      content="Calculate paint requirements and costs for your home. Features paint visualization and detailed cost breakdown."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https:toolwebsite.in/paint-calculator" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="House Paint Calculator" />
    <meta
      name="twitter:description"
      content="Calculate paint requirements and costs for your home. Features paint visualization and detailed cost breakdown."
    />
    <title>House Paint Calculator</title>
    <link rel="canonical" href="https:toolwebsite.in/paint-calculator" />
    <link rel="stylesheet" href="paint.css" />
    <link rel="stylesheet" href="./paintVisual.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>House Paint Calculator</h1>
      <div class="grid">
        <div>
          <label for="paintBrand">Paint Brand:</label>
          <select id="paintBrand">
            <option value="Asian Paint">Asian Paint</option>
            <option value="Berger Paint">Berger Paint</option>
            <option value="Nerolac Paint">Nerolac Paint</option>
            <option value="Dulux">Dulux</option>
          </select>
        </div>
        <div>
          <label for="paintType">Type of Paint:</label>
          <select id="paintType">
            <option value="Interior">Interior</option>
            <option value="Exterior">Exterior</option>
            <option value="Metal Paint">Metal Paint</option>
            <option value="Wood Paint">Wood Paint</option>
          </select>
        </div>
        <div>
          <label for="area">Area (sqft):</label>
          <input type="number" id="area" min="0" step="0.01" />
        </div>
        <div>
          <label for="paintCost">Paint Cost (Rs/ltr):</label>
          <input type="number" id="paintCost" min="0" step="0.01" />
        </div>
        <div>
          <label for="coatType">Coat:</label>
          <select id="coatType">
            <option value="first">First Coat</option>
            <option value="second">Second Coat</option>
          </select>
        </div>
      </div>
      <button onclick="addPaint()">Add Paint</button>
      <button onclick="clearForm()">Clear</button>
      <div id="result"></div>
    </div>

    <div class="container">
      <h4>Selected Paints</h4>
      <ul id="paintList"></ul>
      <div id="totalCost"></div>
      <button onclick="generatePDF()">Download PDF</button>
    </div>

    <script>
      let paints = [];

      function addPaint() {
        const paintBrand = document.getElementById("paintBrand").value;
        const paintType = document.getElementById("paintType").value;
        const area = parseFloat(document.getElementById("area").value);
        const paintCost = parseFloat(
          document.getElementById("paintCost").value
        );
        const coatType = document.getElementById("coatType").value;

        if (isNaN(area) || isNaN(paintCost)) {
          alert("Please enter valid numbers for area and paint cost.");
          return;
        }

        const paintRequired = area / 100;
        const totalCost = paintRequired * paintCost;
        const finalCost = coatType === "second" ? totalCost * 2 : totalCost;

        paints.push({
          brand: paintBrand,
          type: paintType,
          area: area,
          paintRequired: paintRequired,
          cost: finalCost,
          coat: coatType,
        });

        updatePaintList();
        clearForm();
      }

      function updatePaintList() {
        const paintList = document.getElementById("paintList");
        paintList.innerHTML = "";
        let totalCost = 0;

        paints.forEach((paint, index) => {
          const li = document.createElement("li");
          li.innerHTML = `
            ${paint.brand} - ${paint.type} (${paint.coat} coat)<br>
            Area: ${
              paint.area
            } sqft, Paint Required: ${paint.paintRequired.toFixed(2)} ltrs<br>
            Cost: Rs ${paint.cost.toFixed(2)}
            <button class="delete-btn" onclick="deletePaint(${index})">Delete</button>
          `;
          paintList.appendChild(li);
          totalCost += paint.cost;
        });

        document.getElementById(
          "totalCost"
        ).innerHTML = `Total Cost: Rs ${totalCost.toFixed(2)}`;
      }

      function deletePaint(index) {
        paints.splice(index, 1);
        updatePaintList();
      }

      function clearForm() {
        document.getElementById("paintBrand").selectedIndex = 0;
        document.getElementById("paintType").selectedIndex = 0;
        document.getElementById("area").value = "";
        document.getElementById("paintCost").value = "";
        document.getElementById("coatType").selectedIndex = 0;
        document.getElementById("result").innerHTML = "";
      }

      function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.text("Paint Calculator Summary", 10, 10);
        let yPos = 30;

        paints.forEach((paint, index) => {
          doc.text(
            `${index + 1}. ${paint.brand} - ${paint.type} (${paint.coat} coat)`,
            10,
            yPos
          );
          yPos += 10;
          doc.text(
            `   Area: ${
              paint.area
            } sqft, Paint Required: ${paint.paintRequired.toFixed(2)} ltrs`,
            10,
            yPos
          );
          yPos += 10;
          doc.text(`   Cost: Rs ${paint.cost.toFixed(2)}`, 10, yPos);
          yPos += 20;
        });

        const totalCost = paints.reduce((sum, paint) => sum + paint.cost, 0);
        doc.text(`Total Cost: Rs ${totalCost.toFixed(2)}`, 10, yPos);

        doc.save("paint_calculator_summary.pdf");
      }

      // Colos
      const colors = {
        "Asian Paint": {
          Exterior: "#4ECDC4", // Turquoise
          "Metal Paint": "#96CEB4", // Sage Green
          "Wood Paint": "#FFEEAD", // Cream
          "Texture Paint": "#FB9039", // Burnt Orange
          "Designer Paint": "#264653", // Dark Teal
        },
        "Berger Paint": {
          Exterior: "#00BBF9", // Sky Blue
          "Metal Paint": "#F15BB5", // Pink
          "Wood Paint": "#FEE440", // Yellow
          "Texture Paint": "#2A9D8F", // Sea Green
          "Designer Paint": "#E76F51", // Terra Cotta
        },
        "Nerolac Paint": {
          Interior: "#2D3047", // Navy Blue
          Exterior: "#FF9F1C", // Orange
          "Metal Paint": "#E71D36", // Bright Red
          "Wood Paint": "#98CE00", // Lime Green
          "Texture Paint": "#F4A261", // Sandy Orange
          "Designer Paint": "#6B705C", // Olive Gray
        },
        Dulux: {
          Interior: "#845EC2", // Deep Purple
          Exterior: "#00C9A7", // Teal
          "Metal Paint": "#D65DB1", // Magenta
          "Wood Paint": "#4B4453", // Charcoal
          "Texture Paint": "#B5838D", // Mauve
          "Designer Paint": "#457B9D", // Steel Blue
        },
      };

      const paintCatalog = [
        {
          brand: "Asian Paint",
          types: {
            Interior: { name: "Royale Luxury Emulsion", cost: 380 },
            Exterior: { name: "Apex Ultima", cost: 350 },
            "Metal Paint": { name: "Apcolite Premium", cost: 320 },
            "Wood Paint": { name: "WoodTech Emporio", cost: 400 },
          },
          website: "https://www.asianpaints.com",
        },
        {
          brand: "Berger Paint",
          types: {
            Interior: { name: "Silk Luxury Emulsion", cost: 360 },
            Exterior: { name: "WeatherCoat", cost: 340 },
            "Metal Paint": { name: "BP Metal Paint", cost: 300 },
            "Wood Paint": { name: "Imperia Wood Coating", cost: 380 },
          },
          website: "https://www.bergerpaints.com",
        },
        {
          brand: "Nerolac Paint",
          types: {
            Interior: { name: "Excel Total", cost: 340 },
            Exterior: { name: "Excel Top Guard", cost: 320 },
            "Metal Paint": { name: "Nerolac Metal Paint", cost: 290 },
            "Wood Paint": { name: "Wonder Wood Coating", cost: 360 },
          },
          website: "https://www.nerolac.com",
        },
        {
          brand: "Dulux",
          types: {
            Interior: { name: "Velvet Touch", cost: 370 },
            Exterior: { name: "Weathershield", cost: 345 },
            "Metal Paint": { name: "Dulux Metal Paint", cost: 310 },
            "Wood Paint": { name: "Wood Guard", cost: 390 },
          },
          website: "https://www.dulux.in",
        },
      ];

      function initializeVisualization() {
        const palette = document.getElementById("colorPalette");
        const wall = document.getElementById("previewWall");

        const paintBrandSelect = document.getElementById("paintBrand");
        const paintTypeSelect = document.getElementById("paintType");

        function updatePaintCost() {
          const brand = paintBrandSelect.value;
          const type = paintTypeSelect.value;
          const paintInfo = paintCatalog.find((p) => p.brand === brand)?.types[
            type
          ];
          if (paintInfo) {
            document.getElementById("paintCost").value = paintInfo.cost;
          }
        }

        paintBrandSelect.addEventListener("change", updatePaintCost);
        paintTypeSelect.addEventListener("change", updatePaintCost);

        Object.entries(colors).forEach(([brand, types]) => {
          Object.entries(types).forEach(([type, color]) => {
            const swatch = document.createElement("div");
            swatch.className = "color-swatch";
            swatch.style.backgroundColor = color;
            swatch.onclick = () => {
              wall.style.backgroundColor = color;
              paintBrandSelect.value = brand;
              paintTypeSelect.value = type;
              updatePaintCost();
            };
            palette.appendChild(swatch);
          });
        });
      }

      function initializeCatalog() {
        const catalog = document.getElementById("paintCatalog");

        paintCatalog.forEach((paint) => {
          const card = document.createElement("div");
          card.className = "paint-card";

          const typesList = Object.entries(paint.types)
            .map(
              ([type, info]) => `
              <p>${type}: ${info.name} - ₹${info.cost}/liter</p>
            `
            )
            .join("");

          card.innerHTML = `
          
            <h3>${paint.brand}</h3>
            ${typesList}
            <a href="${paint.website}" target="_blank">Visit Website</a>
          `;
          catalog.appendChild(card);
        });
      }

      window.onload = function () {
        initializeVisualization();
        initializeCatalog();
      };
    </script>
  </body>
</html>
