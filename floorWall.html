  <div class="back-button-container" style="padding: 1rem;">
    <a href="index.html" class="back-button" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; background-color: #f3f4f6; border: 1px solid #d1d5db; border-radius: 0.375rem; color: #374151; text-decoration: none; font-weight: 500; transition: all 0.2s;">

     <h2>Floor and Wall Tile Calculator</h2>
         
     <div class="grid-container" id="roomSelection">
       <button class="room-button" data-room="Living Room">
         Living Room
       </button>
       <button class="room-button" data-room="Bedroom">Bedroom</button>
       <button class="room-button" data-room="Kitchen">Kitchen</button>
       <button class="room-button" data-room="Bathroom">Bathroom</button>
       <button class="room-button" data-room="Parking">Parking</button>
     </div>

     <div
       id="estimatorForm"
       class="estimator-form"
       style="display: none"
     >
       <h3 id="roomTitle"></h3>
       <label for="tileType">Tile Type:</label>
       <select id="tileType">
         <option value="floor">Floor Tile</option>
         <option value="wall">Wall Tile</option>
       </select>

       <label for="tileSize">Tile Size:</label>
       <select id="tileSize">
         <option value="1x1">1' x 1'</option>
         <option value="1x2">1' x 2'</option>
         <option value="2x2">2' x 2'</option>
         <option value="2x4">2' x 4'</option>
       </select>

       <label for="area">Total Area (in sq ft):</label>
       <input type="number" id="area" min="1" step="0.01" required />

       <label for="costPerSqFt">Cost per sq ft (in Rs):</label>
       <input
         type="number"
         id="costPerSqFt"
         min="1"
         step="0.01"
         required
       />

       <button onclick="calculateEstimation()">
         Calculate Estimation
       </button>
     </div>

     <div id="estimationResult"></div>
     <div id="estimationList"></div>
     <div id="totalCostDisplay"></div>
     <button class="dte-btn" onclick="downloadTotalEstimation()">
       Download Total Estimation
     </button>
        
          </div>
        <script src="Floorscript.js"></script>
</body>
