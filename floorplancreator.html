<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ensure proper scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floor Plan Generator</title>
    <link rel="stylesheet" href="./floorplancreator.css" />
  </head>
  <body>
    <h1>Floor Plan Generator</h1>

    <!-- Canvas Container: canvas is placed above the controls -->
    <div id="canvasContainer">
      <canvas id="floorCanvas"></canvas>
    </div>

    <!-- Input Controls -->
    <div id="controls">
      <label for="floorWidth">Floor Width (ft):</label>
      <input type="number" id="floorWidth" value="40" min="10" />

      <label for="floorHeight">Floor Height (ft):</label>
      <input type="number" id="floorHeight" value="30" min="10" />

      <label for="livingHallCount">Number of Living Halls:</label>
      <input type="number" id="livingHallCount" value="1" min="0" />

      <label for="bedroomCount">Number of Bedrooms:</label>
      <input type="number" id="bedroomCount" value="3" min="0" />

      <label for="kitchenCount">Number of Kitchens:</label>
      <input type="number" id="kitchenCount" value="1" min="0" />

      <label for="bathroomCount">Number of Bathrooms:</label>
      <input type="number" id="bathroomCount" value="2" min="0" />

      <button onclick="generateFloorPlan()">Generate Floor Plan</button>
    </div>
    <script src="./floorplancreator.js"></script>
  </body>
</html>
