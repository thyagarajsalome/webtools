  </head>

  <body>
    <div class="back-button-container" style="padding: 1rem">
      <a
        href="index.html"
        class="back-button"
        style="
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;
          padding: 0.5rem 1rem;
          background-color: #f3f4f6;
          border: 1px solid #d1d5db;
          border-radius: 0.375rem;
          color: #374151;
          text-decoration: none;
          font-weight: 500;
          transition: all 0.2s;
        "
      >
        <span style="font-size: 1.2rem">←</span>
        Back to Home
      </a>
    </div>
    <div class="container">
      <!-- Header -->
      <header>
        <h1>Indian Electrical Budget Estimator</h1>
        <p>
          Estimate the cost of electrical fittings for your construction
          project.
        </p>
      </header>

      <!-- Input Form -->
      <form id="electricalForm">
        <!-- Project Details -->
        <div class="row g-3">
          <div class="col-md-4">
            <label for="houseArea" class="form-label"
              >House Area (sq.ft.)</label
            >
            <input type="number" class="form-control" id="houseArea" required />
          </div>
          <div class="col-md-4">
            <label for="floors" class="form-label">Number of Floors</label>
            <input type="number" class="form-control" id="floors" required />
          </div>
          <div class="col-md-4">
            <label for="rooms" class="form-label">Total Number of Rooms</label>
            <input type="number" class="form-control" id="rooms" required />
          </div>
        </div>

        <hr class="my-4" />

        <!-- Electrical Components -->
        <div class="row g-3">
          <!-- Existing Components -->
          <div class="col-md-4">
            <label for="sockets" class="form-label">Number of Sockets</label>
            <input type="number" class="form-control" id="sockets" value="10" />
          </div>
          <div class="col-md-4">
            <label for="switches" class="form-label">Number of Switches</label>
            <input type="number" class="form-control" id="switches" value="8" />
          </div>
          <div class="col-md-4">
            <label for="lights" class="form-label">Number of LED Lights</label>
            <input type="number" class="form-control" id="lights" value="20" />
          </div>
          <!-- New Component: Ceiling Fans -->
          <div class="col-md-4">
            <label for="fans" class="form-label">Number of Ceiling Fans</label>
            <input type="number" class="form-control" id="fans" value="5" />
          </div>
          <!-- New Component: Wires with Length and Thickness -->
          <div class="col-md-4">
            <label for="wires" class="form-label"
              >Length of Wires (meters)</label
            >
            <input type="number" class="form-control" id="wires" value="100" />
          </div>
          <div class="col-md-4">
            <label for="wireThickness" class="form-label">Wire Thickness</label>
            <select class="form-select" id="wireThickness">
              <option value="1.5">1.5 mm</option>
              <option value="2.5">2.5 mm</option>
              <option value="4">4 mm</option>
            </select>
          </div>
          <!-- New Component: Electrical Pipes -->
          <div class="col-md-4">
            <label for="pipes" class="form-label"
              >Number of Electrical Pipes</label
            >
            <input type="number" class="form-control" id="pipes" value="10" />
          </div>
          <!-- New Component: UPS -->
          <div class="col-md-4">
            <label for="ups" class="form-label">Number of UPS</label>
            <input type="number" class="form-control" id="ups" value="1" />
          </div>
        </div>

        <hr class="my-4" />

        <!-- Brand Preference -->
        <div class="mb-3">
          <label class="form-label">Preferred Brand Range</label>
          <select class="form-select" id="brandPreference">
            <option value="economy">Economy</option>
            <option value="mid">Mid-Range</option>
            <option value="premium">Premium</option>
          </select>
        </div>

        <hr class="my-4" />

        <!-- Electrical Labor Cost Breakdown -->
        <h4>Electrical Labor Cost Breakdown</h4>
        <div class="row g-3">
          <div class="col-md-4">
            <label for="wiringLabor" class="form-label"
              >Wiring Labor Cost (₹)</label
            >
            <input
              type="number"
              class="form-control"
              id="wiringLabor"
              value="0"
            />
          </div>
          <div class="col-md-4">
            <label for="fittingLabor" class="form-label"
              >Fitting Labor Cost (₹)</label
            >
            <input
              type="number"
              class="form-control"
              id="fittingLabor"
              value="0"
            />
          </div>
          <div class="col-md-4">
            <label for="otherLabor" class="form-label"
              >Other Labor Cost (₹)</label
            >
            <input
              type="number"
              class="form-control"
              id="otherLabor"
              value="0"
            />
          </div>
        </div>

        <hr class="my-4" />

        <div class="text-center">
          <button type="submit" class="btn btn-primary">
            Calculate Budget
          </button>
        </div>
      </form>

      <!-- Results Section -->
      <section class="result-section">
        <h3>Estimation Results</h3>
        <div id="summary" class="mb-3"></div>

        <!-- Brand Comparison Table (for components with brand data) -->
        <h4 class="mt-4">Branded Cost Comparison</h4>
        <table class="table table-bordered">
          <thead>
            <tr>
              <th>Component</th>
              <th>Havells (₹)</th>
              <th>Anchor (₹)</th>
              <th>Schneider (₹)</th>
            </tr>
          </thead>
          <tbody id="brandComparison">
            <!-- Rows will be injected by JavaScript -->
          </tbody>
        </table>
      </section>
    </div>

    <!-- JavaScript -->
    <script>
      // Sample market cost data (per unit cost in INR)
      const costData = {
        sockets: {
          economy: 50,
          mid: 80,
          premium: 120,
          brands: { Havells: 80, Anchor: 70, Schneider: 90 },
        },
        switches: {
          economy: 30,
          mid: 50,
          premium: 80,
          brands: { Havells: 55, Anchor: 45, Schneider: 60 },
        },
        lights: {
          economy: 100,
          mid: 150,
          premium: 250,
          brands: { Havells: 160, Anchor: 140, Schneider: 170 },
        },
        fans: {
          economy: 1500,
          mid: 2500,
          premium: 4000,
        },
        // Wires: cost depends on both brand preference and wire thickness
        wires: {
          economy: { 1.5: 20, 2.5: 35, 4: 50 },
          mid: { 1.5: 30, 2.5: 45, 4: 60 },
          premium: { 1.5: 40, 2.5: 60, 4: 80 },
        },
        electricalPipes: {
          economy: 100,
          mid: 150,
          premium: 200,
        },
        ups: {
          economy: 3000,
          mid: 4500,
          premium: 6000,
        },
      };

      document
        .getElementById("electricalForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // Retrieve input values for components
          const sockets = parseInt(
            document.getElementById("sockets").value,
            10
          );
          const switches = parseInt(
            document.getElementById("switches").value,
            10
          );
          const lights = parseInt(document.getElementById("lights").value, 10);
          const fans = parseInt(document.getElementById("fans").value, 10);
          const wiresLength = parseInt(
            document.getElementById("wires").value,
            10
          );
          const wireThickness = document.getElementById("wireThickness").value;
          const pipes = parseInt(document.getElementById("pipes").value, 10);
          const ups = parseInt(document.getElementById("ups").value, 10);
          const brandPref = document.getElementById("brandPreference").value;

          // Retrieve labor cost inputs
          const wiringLabor =
            parseFloat(document.getElementById("wiringLabor").value) || 0;
          const fittingLabor =
            parseFloat(document.getElementById("fittingLabor").value) || 0;
          const otherLabor =
            parseFloat(document.getElementById("otherLabor").value) || 0;
          const laborTotal = wiringLabor + fittingLabor + otherLabor;

          // Calculate component costs based on brand preference
          const costSockets = sockets * costData.sockets[brandPref];
          const costSwitches = switches * costData.switches[brandPref];
          const costLights = lights * costData.lights[brandPref];
          const costFans = fans * costData.fans[brandPref];
          const costWires =
            wiresLength * costData.wires[brandPref][wireThickness];
          const costPipes = pipes * costData.electricalPipes[brandPref];
          const costUPS = ups * costData.ups[brandPref];

          // Calculate total component cost and grand total (components + labor)
          const componentsTotal =
            costSockets +
            costSwitches +
            costLights +
            costFans +
            costWires +
            costPipes +
            costUPS;
          const grandTotal = componentsTotal + laborTotal;

          // Update summary
          document.getElementById("summary").innerHTML = `
          <p><strong>Grand Total Estimated Cost:</strong> ₹${grandTotal.toLocaleString()}</p>
          <p>
            <strong>Components:</strong> ₹${componentsTotal.toLocaleString()}<br/>
            Sockets: ₹${costSockets.toLocaleString()} | Switches: ₹${costSwitches.toLocaleString()} | LED Lights: ₹${costLights.toLocaleString()} | Ceiling Fans: ₹${costFans.toLocaleString()}<br/>
            Wires: ₹${costWires.toLocaleString()} | Electrical Pipes: ₹${costPipes.toLocaleString()} | UPS: ₹${costUPS.toLocaleString()}<br/>
            <strong>Labor:</strong> ₹${laborTotal.toLocaleString()} (Wiring: ₹${wiringLabor.toLocaleString()}, Fitting: ₹${fittingLabor.toLocaleString()}, Other: ₹${otherLabor.toLocaleString()})
          </p>
        `;

          // Update Brand Comparison Table (for components with brand data)
          document.getElementById("brandComparison").innerHTML = `
          <tr>
            <td>Sockets</td>
            <td>₹${costData.sockets.brands.Havells}</td>
            <td>₹${costData.sockets.brands.Anchor}</td>
            <td>₹${costData.sockets.brands.Schneider}</td>
          </tr>
          <tr>
            <td>Switches</td>
            <td>₹${costData.switches.brands.Havells}</td>
            <td>₹${costData.switches.brands.Anchor}</td>
            <td>₹${costData.switches.brands.Schneider}</td>
          </tr>
          <tr>
            <td>LED Lights</td>
            <td>₹${costData.lights.brands.Havells}</td>
            <td>₹${costData.lights.brands.Anchor}</td>
            <td>₹${costData.lights.brands.Schneider}</td>
          </tr>
        `;
        });
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
