<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="./normalize.css" />
    <style>
      /* Base styles */
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        margin: 20px;
        color: #333;
        background-color: #f9f9f9;
      }

      /* Headings styling */
      h1 {
        color: #2e6da4;
        border-bottom: 2px solid #ccc;
        padding-bottom: 10px;
      }

      h2 {
        color: #337ab7;
        margin-top: 1.5em;
      }

      /* Contact Info styles */
      .contact-info {
        background-color: #fff;
        padding: 20px;
        border: 1px solid #ccc;
        max-width: 600px;
        margin: 20px 0;
      }

      .contact-item {
        margin-bottom: 15px;
      }

      .contact-item span {
        font-weight: bold;
      }

      /* Link styles */
      a {
        color: #337ab7;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Contact Us</h1>

    <div class="contact-info">
      <div class="contact-item">
        <span>Email:</span>
        <a href="mailto:contact@toolwebsite.in">contact@toolwebsite.in</a>
      </div>
      <div class="contact-item">
        <span>Place:</span> Bengaluru, Karnataka, India
      </div>
      <div class="contact-item">
        <span>Website:</span>
        <a href="https://toolwebsite.in/" target="_blank">toolwebsite.in</a>
      </div>
    </div>
  </body>
</html>
