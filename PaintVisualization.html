<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paint Visualization</title>
    <style>
      /* Reset & Base Styles */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        font-size: 16px;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        line-height: 1.6;
        padding: 1rem;
      }

      /****************************************
       * Layout Sections
       ****************************************/
      .top-section {
        display: grid;
        grid-template-columns: 1fr 220px;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .visualization-area {
        position: relative;
        border: 2px solid #333;
        border-radius: 8px;
        overflow: hidden;
        min-height: 400px;
      }
      #baseImage {
        display: block;
        width: 100%;
        height: auto;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        border: 2px solid #333;
        border-radius: 8px;
        padding: 1rem;
        background: #262626;
        justify-content: flex-start;
        align-items: stretch;
      }

      .bottom-section {
        border: 2px solid #333;
        border-radius: 8px;
        padding: 1rem;
        background: #262626;
      }

      /****************************************
       * Visualization Overlays
       ****************************************/
      .color-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        opacity: 0;
        transition: opacity 0.3s ease;
        mix-blend-mode: multiply;
      }

      /****************************************
       * Category Buttons (Sidebar)
       ****************************************/
      .color-categories {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .category-button {
        background: #333;
        color: #e0e0e0;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        text-align: center;
        transition: background-color 0.2s ease;
      }
      .category-button.active,
      .category-button:hover {
        background-color: #ff7043;
      }

      /****************************************
       * Mobile Menu Icon for Categories
       ****************************************/
      .mobile-menu-icon {
        display: none;
        background: #333;
        padding: 0.5rem;
        text-align: center;
        border-radius: 4px;
        margin-bottom: 1rem;
        cursor: pointer;
      }
      #colorCategoriesContainer {
        position: static;
      }
      .mobile-close-icon {
        display: none;
      }

      /****************************************
       * Reset Button & Room Select (Sidebar)
       ****************************************/
      .reset-button {
        color: #fff;
        background-color: #333;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.2s ease;
        margin-bottom: 1rem;
      }
      .reset-button:hover {
        background-color: #63c8ed;
      }
      .room-selection {
        text-align: center;
      }
      .room-selection select {
        padding: 0.5rem 1rem;
        border-radius: 4px;
        border: 1px solid #333;
        background-color: #262626;
        color: #e0e0e0;
        font-size: 1rem;
      }

      /****************************************
       * Color Options (Squares in Bottom Section)
       ****************************************/
      .color-options {
        display: flex;
        flex-wrap: wrap;
        flex-wrap: no;
        gap: 0.5rem;
        justify-content: center;
      }
      .color-item {
        width: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .color-button {
        width: 48px;
        height: 48px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        outline: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .color-button.active {
        transform: scale(1.15);
        box-shadow: 0 0 8px rgba(38, 166, 154, 0.8);
      }

      /****************************************
       * (Optional) Hide Color Details & Finish
       ****************************************/
      .color-details {
        display: none;
      }

      /****************************************
       * Responsive Breakpoints
       ****************************************/
      @media (max-width: 768px) {
        .top-section {
          display: block;
        }
        .visualization-area {
          margin-bottom: 1rem;
          min-height: 300px;
        }
        .mobile-menu-icon {
          display: block;
        }
        #colorCategoriesContainer {
          display: none;
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          background: #262626;
          padding: 1rem;
          z-index: 999;
        }
        #colorCategoriesContainer.active {
          display: flex;
          flex-direction: column;
        }
        .mobile-close-icon {
          display: block;
          margin-bottom: 1rem;
          text-align: right;
          cursor: pointer;
        }
      }
    </style>
  </head>
  <body>
    <!-- TOP SECTION: Visualization (left) + Sidebar (right) -->
    <div class="top-section">
      <!-- Visualization Area -->
      <div class="visualization-area">
        <img src="" alt="Base" id="baseImage" />
      </div>

      <!-- Sidebar -->
      <div class="sidebar">
        <!-- Mobile toggle for categories -->
        <div class="mobile-menu-icon" id="mobileMenuIcon">
          &#9776; Categories
        </div>

        <!-- Category Buttons (vertical list) -->
        <div class="color-categories" id="colorCategoriesContainer">
          <span class="mobile-close-icon" id="mobileCloseIcon"
            >&times; Close</span
          >
          <!-- Category buttons injected by JS -->
        </div>

        <!-- Reset Button -->
        <button class="reset-button" id="resetButton">Reset</button>

        <!-- Room Selection -->
        <div class="room-selection">
          <select id="roomSelect"></select>
        </div>
      </div>
    </div>

    <!-- BOTTOM SECTION: Color Squares -->
    <div class="bottom-section">
      <div class="color-options"></div>
    </div>

    <!-- (Hidden) Color Details Panel -->
    <div class="color-details" id="colorDetails">
      <p id="colorRGB"></p>
      <p id="colorHex"></p>
      <p id="colorCategory"></p>
      <p id="colorRoom"></p>
      <div class="finish-selection">
        <label for="finishSelect">Finish:</label>
        <select id="finishSelect">
          <option value="both">Both</option>
          <option value="matt">Matt</option>
          <option value="glossy">Glossy</option>
        </select>
      </div>
      <p id="colorFinishDisplay"></p>
    </div>

    <!-- Colors data is now loaded from a separate file -->
    <script src="./colors.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Configuration for each room/visualizer category
        const visualizerConfigs = {
          livingroom: {
            baseImage: "./images-livingroom/base.jpg",
            overlayPath: "./images-livingroom/",
          },
          // Add more rooms as needed...
        };

        // DOM elements
        const roomSelect = document.getElementById("roomSelect");
        const baseImage = document.getElementById("baseImage");
        const visualizationArea = document.querySelector(".visualization-area");
        const colorOptionsContainer = document.querySelector(".color-options");
        const resetButton = document.getElementById("resetButton");

        // Mobile navigation elements
        const mobileMenuIcon = document.getElementById("mobileMenuIcon");
        const colorCategoriesContainer = document.getElementById(
          "colorCategoriesContainer"
        );
        const mobileCloseIcon = document.getElementById("mobileCloseIcon");

        // Color details (currently hidden)
        const colorRGBEl = document.getElementById("colorRGB");
        const colorHexEl = document.getElementById("colorHex");
        const colorCategoryEl = document.getElementById("colorCategory");
        const colorRoomEl = document.getElementById("colorRoom");
        const colorFinishDisplayEl =
          document.getElementById("colorFinishDisplay");
        const finishSelect = document.getElementById("finishSelect");

        // Global variables
        let currentColor = null;
        let currentConfig = null;
        let overlays = {}; // holds overlay image elements

        /****************************************
         * Helper Functions
         ****************************************/
        function rgbToHsl(r, g, b) {
          r /= 255;
          g /= 255;
          b /= 255;
          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          let h, s;
          const l = (max + min) / 2;

          if (max === min) {
            h = s = 0;
          } else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
              case r:
                h = (g - b) / d + (g < b ? 6 : 0);
                break;
              case g:
                h = (b - r) / d + 2;
                break;
              case b:
                h = (r - g) / d + 4;
                break;
            }
            h *= 60;
          }
          return { h, s, l };
        }

        function rgbStringToHex(rgbStr) {
          const regex = /rgb\(\s*(\d+),\s*(\d+),\s*(\d+)\s*\)/;
          const result = regex.exec(rgbStr);
          if (!result) return "#000000";
          const r = parseInt(result[1]).toString(16).padStart(2, "0");
          const g = parseInt(result[2]).toString(16).padStart(2, "0");
          const b = parseInt(result[3]).toString(16).padStart(2, "0");
          return `#${r}${g}${b}`;
        }

        function getColorCategory(rgbStr) {
          const regex = /rgb\(\s*(\d+),\s*(\d+),\s*(\d+)\s*\)/;
          const result = regex.exec(rgbStr);
          if (!result) return "Neutral";
          const r = parseInt(result[1]);
          const g = parseInt(result[2]);
          const b = parseInt(result[3]);
          const { h, s, l } = rgbToHsl(r, g, b);

          if (s < 0.25 || l < 0.2 || l > 0.8) {
            return "Neutral";
          }
          if (h >= 345 || h < 15) {
            return "Red";
          }
          if (h >= 15 && h < 45) {
            return l < 0.5 ? "Brown" : "Orange";
          }
          if (h >= 45 && h < 75) {
            return "Yellow";
          }
          if (h >= 75 && h < 150) {
            return "Green";
          }
          if (h >= 150 && h < 225) {
            return "Blue";
          }
          if (h >= 225 && h < 345) {
            return "Purple";
          }
          return "Neutral";
        }

        function buildColorCategories() {
          const categories = {
            Red: [],
            Brown: [],
            Orange: [],
            Yellow: [],
            Green: [],
            Blue: [],
            Purple: [],
            Neutral: [],
          };
          for (let key in colors) {
            const cat = getColorCategory(colors[key]);
            if (categories[cat]) {
              categories[cat].push(key);
            }
          }
          return categories;
        }

        /****************************************
         * Main Logic
         ****************************************/
        const colorCategories = buildColorCategories();

        function renderCategoryButtons() {
          // Reset container content and add mobile close icon
          colorCategoriesContainer.innerHTML =
            '<span class="mobile-close-icon" id="mobileCloseIcon">&times; Close</span>';
          Object.keys(colorCategories).forEach((category) => {
            const btn = document.createElement("button");
            btn.className = "category-button";
            btn.dataset.category = category;
            btn.textContent = category;
            colorCategoriesContainer.appendChild(btn);
          });
          // Reattach mobile close event
          const newMobileCloseIcon = document.getElementById("mobileCloseIcon");
          newMobileCloseIcon.addEventListener("click", () => {
            colorCategoriesContainer.classList.remove("active");
          });
        }

        function renderColorButtons(category) {
          colorOptionsContainer.innerHTML = "";
          const colorKeys = colorCategories[category];
          if (!colorKeys) return;
          // Sort numerically if keys are numeric strings
          colorKeys.sort((a, b) => Number(a) - Number(b));
          colorKeys.forEach((key) => {
            const colorItem = document.createElement("div");
            colorItem.className = "color-item";
            const button = document.createElement("button");
            button.className = "color-button";
            button.dataset.color = key;
            button.style.backgroundColor = colors[key];
            button.setAttribute("aria-label", "Color");
            colorItem.appendChild(button);
            colorOptionsContainer.appendChild(colorItem);

            button.addEventListener("click", () => {
              if (currentColor !== key) {
                selectColor(key);
              }
            });
          });
        }

        function setupCategoryButtonListeners() {
          const buttons = document.querySelectorAll(".category-button");
          buttons.forEach((btn) => {
            btn.addEventListener("click", () => {
              // Set active state for category buttons
              buttons.forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");

              // Render corresponding color squares and reset selection
              const category = btn.dataset.category;
              renderColorButtons(category);
              selectColor(null);

              // Close mobile menu if open
              if (colorCategoriesContainer.classList.contains("active")) {
                colorCategoriesContainer.classList.remove("active");
              }
            });
          });
        }

        function updateColorDetails(colorId) {
          if (colorId) {
            const rgbValue = colors[colorId];
            const hexValue = rgbStringToHex(rgbValue);
            const category = getColorCategory(rgbValue);
            const roomName = roomSelect.value
              ? roomSelect.value.charAt(0).toUpperCase() +
                roomSelect.value.slice(1)
              : "";
            const finish = finishSelect.value;

            colorRGBEl.textContent = `RGB: ${rgbValue}`;
            colorHexEl.textContent = `Hex: ${hexValue}`;
            colorCategoryEl.textContent = `Category: ${category}`;
            colorRoomEl.textContent = `Room: ${roomName}`;
            colorFinishDisplayEl.textContent = `Finish: ${finish}`;
          } else {
            // Clear details if no color selected
            colorRGBEl.textContent = "";
            colorHexEl.textContent = "";
            colorCategoryEl.textContent = "";
            colorRoomEl.textContent = "";
            colorFinishDisplayEl.textContent = "";
          }
        }

        function selectColor(colorId) {
          if (colorId === currentColor) {
            return;
          }
          // Hide all overlays and remove active class from all color buttons
          Object.values(overlays).forEach(
            (overlay) => (overlay.style.opacity = "0")
          );
          document
            .querySelectorAll(".color-button")
            .forEach((b) => b.classList.remove("active"));

          if (colorId) {
            let overlay;
            if (overlays[colorId]) {
              overlay = overlays[colorId];
            } else {
              overlay = document.createElement("img");
              overlay.src = `${currentConfig.overlayPath}${colorId}.jpg`;
              overlay.alt = "Overlay";
              overlay.className = "color-overlay";
              overlay.style.opacity = "0";
              visualizationArea.appendChild(overlay);
              overlays[colorId] = overlay;
            }
            overlay.style.opacity = "1";

            const button = document.querySelector(`[data-color="${colorId}"]`);
            if (button) button.classList.add("active");

            currentColor = colorId;
            updateColorDetails(colorId);
          } else {
            currentColor = null;
            updateColorDetails(null);
          }
        }

        // Reset button: clear any active selection
        resetButton.addEventListener("click", () => {
          selectColor(null);
        });

        // Room selection: change visualizer configuration
        roomSelect.addEventListener("change", () => {
          currentConfig = visualizerConfigs[roomSelect.value];
          initializeVisualizer();
        });

        // Mobile menu toggle for categories
        mobileMenuIcon.addEventListener("click", () => {
          colorCategoriesContainer.classList.add("active");
        });

        // Finish selection change updates details
        finishSelect.addEventListener("change", () => {
          if (currentColor) {
            updateColorDetails(currentColor);
          }
        });

        // Populate room selection dropdown
        function populateRoomSelect() {
          roomSelect.innerHTML = "";
          Object.keys(visualizerConfigs).forEach((key) => {
            const option = document.createElement("option");
            option.value = key;
            option.textContent =
              key.charAt(0).toUpperCase() + key.slice(1).toLowerCase();
            roomSelect.appendChild(option);
          });
        }

        // Initialize the visualizer for the selected room
        function initializeVisualizer() {
          // Remove any existing overlays and reset selection
          Object.values(overlays).forEach((overlay) => overlay.remove());
          overlays = {};
          currentColor = null;

          // Load the new base image
          if (currentConfig && currentConfig.baseImage) {
            baseImage.src = currentConfig.baseImage;
          }

          // Set default category to "Red" and render its colors
          const defaultCategory = "Red";
          const catButtons = document.querySelectorAll(".category-button");
          catButtons.forEach((btn) => {
            btn.classList.toggle(
              "active",
              btn.dataset.category === defaultCategory
            );
          });
          renderColorButtons(defaultCategory);
          updateColorDetails(null);
        }

        // On DOM load, populate room select, build categories, attach listeners, and initialize visualizer
        populateRoomSelect();
        currentConfig = visualizerConfigs[roomSelect.value]; // default selected room
        renderCategoryButtons();
        setupCategoryButtonListeners();
        initializeVisualizer();
      });
    </script>
  </body>
</html>
